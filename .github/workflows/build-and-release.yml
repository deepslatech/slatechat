name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  verify-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon clean build

  build-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - id: version
        run: echo "value=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - run: ./gradlew --no-daemon clean build
      - run: cp build/libs/SlateChat-*.jar build/libs/SlateChat.jar
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          gh release create "$TAG" build/libs/SlateChat.jar \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
