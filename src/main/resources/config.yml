#
# Message sent when the player doesnt have permission for
# a channel or any command of the plugin.
#
no_permission: "<red>You do not have permission!"

#
# Message sent to the sender saying the amount of players
# who readed the player message.
#
amount_readed: "<dark_purple><amount> players saw your message!"

#
# Message sent when no one readed the player message
#
no_one: "<red>No one readed your message! :c"

#
# When console or any non-player tries to execute a command they shouldn't
#
players_only: "<red>Only players can execute this command!"

#
# Sent when player incorrectly uses /channel
#
channel_command_usage: "<red>Usage: /ch <channel>"

#
# Sent when the player tries to do chat without any text
#
channel_usage_message: "<red>Usage: /<command> <message>"

#
# Message sent when the player changes the main channel with /ch
# Placeholders:
# <channelName> - Full name of the channel
# <channelCommand> - Command of the channel
#
channel_changed: "<green>Channel changed to <channelName> - <channelCommand>"

#
# Sent when the player do not have permission to use a channel or somehow the channel do not exist
#
invalid_channel: "<red>Invalid channel!"

#
# Text sent when plugin is reloaded
#
plugin_reloaded: "<green>Plugin reloaded."

#
# Update checker messages (see modules.update_checker)
# Placeholders: <version> - the newer version found, <current> - the version you're running
#
update_available: "<yellow>A new SlateChat version (<green><version></green>) is available! You are running <red><current></red>."
# Sent to whoever ran /slatechat update when there's nothing newer
update_up_to_date: "<green>You're already running the latest version (<current>)."
# Sent to whoever ran /slatechat update if GitLab couldn't be reached
update_check_failed: "<red>Could not reach GitLab to check for updates. Try again later."
# The 3 messages below are printed to the server console via the console sender
# (an Audience, like a player), not plugin.logger -- so MiniMessage tags render as
# actual color there too, same as everywhere else.
#
# Logged to console on startup if an update was found. Placeholders: <version>, <current>, <url>
update_console_log: "<gray>A new version (<yellow><version></yellow>) is available! You are running <current>. Download: <url></gray>"
# Logged to console on startup when already up to date. Placeholder: <current>
update_console_up_to_date: "<gray>You are running the latest version (<green><current></green>).</gray>"
# Logged to console on startup if the check itself failed (offline, GitLab down, etc.)
update_console_check_failed: "<red>Could not check for updates."

#
# Should all chat messages be sent to console?
#
log_to_console: true

#
# Message send to console when someone uses chat
# Placeholders:
# <channel> - Full channel name
# <channelCmd> - Channel command
# <player> - The player who sent the message
# <message> - The message itself
# Any PAPI placeholder
#
console_log: "[<channel>] <player>> <message>"

#
# Enable or disable plugin components here
# Every module have its own configuration file
# so you will not get distracted with useless or unrelated
# things while setting up the plugin.
#
modules:
    #
    # Chat color module
    # Players can choose their own chatcolor
    # either normal (&c) or hexadecimal (#4DC3FF)
    #
    chatcolor: true
    #
    # DiscordSRV integration
    # if you would like to enable integration with DiscordSRV,
    # enable this option.
    # The plugin will send chat messages from channels as configured in DiscordSRV.
    # but it will NOT receive messages from Discord and send to the chat.
    #
    discordsrv: true
    # Optional: forward chat from plugin to DiscordSRV, per-channel as mapped in DiscordSRV's
    # own "Channels" config option (default false to avoid duplicates). Channels not listed
    # there in DiscordSRV's config are not forwarded.
    discordsrv_send: false
    #
    # ItemsAdder integration
    # Resolves ItemsAdder's :emoji_name: shorthand (and other font images) found in chat
    # messages or baked into channel formats, so they render instead of showing as literal
    # text. Only takes effect if ItemsAdder is installed; has no effect otherwise.
    #
    itemsadder: true
    #
    # Update checker
    # Checks GitLab for a newer SlateChat release on startup (async, never blocks
    # startup or chat). Logs to console if outdated; players with chat.update also
    # get a chat notice on join. Safe to disable if you don't want it phoning home.
    #
    update_checker: true
    #
    # Chat focus modules
    # Players can choose a chat to default speak on or
    # Optionally, force chat worlds can be set-up
    #
    focus: true
    #
    # Chat filter and replacer module
    # Messages containing specific pre-defined words will be replaced
    # Disable if you don't need this
    #
    filter: true
    #
    # Chat formatting
    #
    chatformat:
        #
        # Prohibits the use of many repeated characters
        # According to the defined limit
        # Example: aaaaa
        #
        spam:
            enable: false
            limit: 10
            message: "<green>Message canceled because contain spam."
        #
        # Cancel sending repeated messages
        #
        flood:
            enable: false
            message: "<green>You cannot send a message like the previous message."
        #
        # Change the sentence to lowercase
        # If disabled, the message will be sent as entered.
        #
        lowercase: false
        #
        # Always send a message with the first letter capitalized
        #
        title_format: false
