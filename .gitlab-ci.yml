stages:
  - test
  - release

# Build-only sanity check for feature branches / merge requests - lets you see
# the Gradle build actually run in the runner before merging, without touching
# releases (that stays default-branch-only, see build-and-release below).
verify-build:
  stage: test
  image: eclipse-temurin:21-jdk
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon clean build

build-and-release:
  stage: release
  image: eclipse-temurin:21-jdk
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - gradle.properties
  script:
    - apt-get update -qq && apt-get install -y -qq curl jq > /dev/null

    # Version lives in gradle.properties; this job only runs when gradle.properties
    # changed on the default branch, so a bump here is what drives everything below.
    - VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
    - TAG="v${VERSION}"
    - echo "gradle.properties version is ${VERSION}, tag ${TAG}"

    # If this version was already released (e.g. gradle.properties changed for some
    # other reason without a version bump), there's nothing to do.
    - |
      STATUS=$(curl -s -o /dev/null -w "%{http_code}" --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${TAG}")
      if [ "$STATUS" = "200" ]; then
        echo "Release ${TAG} already exists, nothing to do."
        exit 0
      fi

    - chmod +x gradlew
    - ./gradlew --no-daemon clean build

    # Two platform jars now, not one -- paper/velocity are separate Gradle subprojects, each
    # with its own versioned shadow jar (SlateChat-Paper-<version>.jar /
    # SlateChat-Velocity-<version>.jar, see paper/build.gradle.kts and velocity/build.gradle.kts).
    # Copy each to an unversioned name too, same trick the old single-jar build used: the
    # release's permalink/latest/downloads/... URL always has to point at a fixed filename to
    # keep serving whatever the newest release is.
    - cp paper/build/libs/SlateChat-Paper-*.jar paper/build/libs/SlateChat-Paper.jar
    - cp velocity/build/libs/SlateChat-Velocity-*.jar velocity/build/libs/SlateChat-Velocity.jar

    # Publish both jars to this project's Generic Package Registry - permanent, versioned
    # URLs that the release's asset links point to below.
    - |
      PAPER_PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/slatechat/${VERSION}/SlateChat-Paper.jar"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file paper/build/libs/SlateChat-Paper.jar \
           "${PAPER_PACKAGE_URL}"
    - |
      VELOCITY_PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/slatechat/${VERSION}/SlateChat-Velocity.jar"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file velocity/build/libs/SlateChat-Velocity.jar \
           "${VELOCITY_PACKAGE_URL}"

    # Pull the "## [$VERSION]" section out of CHANGELOG.md to use as the
    # release description/patch notes, instead of a bare "SlateChat x.y.z"
    # with no actual notes. Falls back to that bare string if CHANGELOG.md
    # is missing a section for this version, so a forgotten changelog entry
    # doesn't break the release.
    - |
      DESC=$(awk -v ver="$VERSION" '
        /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
        found { print }
      ' CHANGELOG.md | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')
      if [ -z "$DESC" ]; then
        echo "No CHANGELOG.md section found for ${VERSION}, falling back to a bare description."
        DESC="SlateChat ${VERSION}"
      fi

    # Create the release (and its tag, since ${TAG} doesn't exist yet) with two asset links,
    # one per platform jar, each with its own fixed "filepath" so
    # /-/releases/permalink/latest/downloads/SlateChat-Paper.jar and .../SlateChat-Velocity.jar
    # always serve whatever the newest release is.
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" \
           --data "$(jq -n \
             --arg tag "$TAG" \
             --arg desc "$DESC" \
             --arg ref "$CI_COMMIT_SHA" \
             --arg paperUrl "$PAPER_PACKAGE_URL" \
             --arg velocityUrl "$VELOCITY_PACKAGE_URL" \
             '{tag_name: $tag, description: $desc, ref: $ref, assets: {links: [
               {name: "SlateChat-Paper.jar", url: $paperUrl, filepath: "/SlateChat-Paper.jar", link_type: "package"},
               {name: "SlateChat-Velocity.jar", url: $velocityUrl, filepath: "/SlateChat-Velocity.jar", link_type: "package"}
             ]}}')" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
